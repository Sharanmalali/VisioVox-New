# Overlay: reach the production stack from this machine, without a tunnel.
#
#   ./infra/local/deploy.sh --local
#
# The tunnel reaches the edge proxy and nothing else; this publishes that same
# proxy on loopback, so the production images - routing included - can be
# exercised before a domain exists. Set the public URLs in .env.production to
# http://localhost:8080 for this mode (docs/23 §2).
#
# Bound to 127.0.0.1 explicitly. Plain "8080:8080" listens on every interface,
# which on a laptop on college wifi means everyone on that network.
services:
  edge:
    ports:
      - '127.0.0.1:8080:8080'
